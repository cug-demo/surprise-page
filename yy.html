<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<title>有一个小惊喜 ✨</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05040a;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;user-select:none;-webkit-user-select:none;
  }
  #c{display:block;position:fixed;inset:0;}
  .hint{
    position:fixed;left:50%;bottom:11%;transform:translateX(-50%);
    color:#fff;font-size:15px;letter-spacing:.24em;white-space:nowrap;
    animation:breath 2.4s ease-in-out infinite;
    transition:opacity .6s ease;pointer-events:none;
  }
  @keyframes breath{0%,100%{opacity:.25}50%{opacity:.95}}
  .msg{
    position:fixed;left:50%;bottom:11%;
    transform:translateX(-50%) translateY(12px);
    color:#fff;font-size:clamp(15px,4.4vw,20px);
    letter-spacing:.18em;white-space:nowrap;
    opacity:0;pointer-events:none;
    text-shadow:0 0 18px rgba(255,110,170,.9),0 0 44px rgba(255,60,140,.6);
    transition:opacity 1.2s ease,transform 1.2s ease;
  }
  .msg.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">轻触屏幕 · 有惊喜</div>
<div class="msg" id="msg">愿你今天有好事发生 ✨</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx    = canvas.getContext('2d');
  var hintEl = document.getElementById('hint');
  var msgEl  = document.getElementById('msg');

  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
  var particles = [], stars = [];
  var phase = 'idle';
  var clickTime = 0, lastFrame = 0, revealed = false;
  var TAU = Math.PI * 2;

  /* ---------- 画布尺寸 ---------- */
  function setupCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H * 0.44;
  }

  /* ---------- 生成爱心粒子 ---------- */
  function buildParticles() {
    var n = Math.round(Math.min(1200, Math.max(650, (W * H) / 1100)));
    particles = [];
    for (var i = 0; i < n; i++) {
      var t  = Math.random() * TAU;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
             - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      hy = -hy - 2.6;                          // 翻转并居中
      var r = Math.sqrt(Math.random());        // 向内部填充

      var p = {
        x: cx + (Math.random() - 0.5) * 38,
        y: cy + (Math.random() - 0.5) * 38,
        vx: 0, vy: 0,
        ux: hx * r,
        uy: hy * r,
        hue: 322 + Math.random() * 42,
        light: 62 + Math.random() * 16,
        size: 0.7 + Math.random() * 1.3,
        ph: Math.random() * TAU
      };
      p.color = 'hsl(' + p.hue.toFixed(0) + ',100%,' + p.light.toFixed(0) + '%)';
      particles.push(p);
    }
  }

  /* ---------- 背景星点 ---------- */
  function buildStars() {
    stars = [];
    var n = Math.round((W * H) / 12000);
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        ph: Math.random() * TAU,
        sp: 0.4 + Math.random() * 1.2
      });
    }
  }

  /* ---------- 点击触发 ---------- */
  function begin() {
    if (phase !== 'idle') return;
    phase = 'explode';
    clickTime = performance.now();
    hintEl.style.opacity = '0';

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = Math.random() * TAU;
      var sp = 4 + Math.pow(Math.random(), 0.6) * 13;
      p.x = cx + (Math.random() - 0.5) * 20;
      p.y = cy + (Math.random() - 0.5) * 20;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
    }
  }

  /* ---------- 每帧更新 ---------- */
  function update(dt, now) {
    var i, p;

    if (phase === 'idle') {
      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        p.x += Math.cos(now / 1000 + p.ph) * 0.28 * dt;
        p.y += Math.sin(now / 1250 + p.ph * 1.6) * 0.28 * dt;
        p.x += (cx - p.x) * 0.012 * dt;
        p.y += (cy - p.y) * 0.012 * dt;
      }
      return;
    }

    if (phase === 'explode') {
      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.06 * dt;
        var f = Math.pow(0.955, dt);
        p.vx *= f;
        p.vy *= f;
      }
      if (now - clickTime > 520) phase = 'gather';
      return;
    }

    // gather：弹簧吸附 + 轻微心跳
    var scale = Math.min(W, H) * 0.0165;
    var beat  = 1 + 0.022 * Math.sin(now / 700);

    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      var tx = cx + p.ux * scale * beat;
      var ty = cy + p.uy * scale * beat;
      p.vx += (tx - p.x) * 0.045 * dt;
      p.vy += (ty - p.y) * 0.045 * dt;
      var d = Math.pow(0.87, dt);
      p.vx *= d;
      p.vy *= d;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    if (!revealed && now - clickTime > 1900) {
      revealed = true;
      msgEl.classList.add('show');
    }
  }

  /* ---------- 每帧绘制 ---------- */
  function draw(now) {
    ctx.globalCompositeOperation = 'lighter';

    // 星点
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      var a = 0.12 + 0.45 * (0.5 + 0.5 * Math.sin(now / 1400 * st.sp + st.ph));
      ctx.fillStyle = 'rgba(200,220,255,' + a.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, TAU);
      ctx.fill();
    }

    // 粒子
    var alive = (phase === 'gather');
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var x = p.x, y = p.y;
      if (alive) {
        x += Math.sin(now / 520 + p.ph) * 0.7;
        y += Math.cos(now / 640 + p.ph) * 0.7;
      }
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, TAU);
      ctx.fill();
    }
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame) / 16.667;
    lastFrame = now;
    if (dt > 3) dt = 3;

    ctx.clearRect(0, 0, W, H);
    update(dt, now);
    draw(now);
  }

  /* ---------- 初始化 ---------- */
  setupCanvas();
  buildParticles();
  buildStars();
  requestAnimationFrame(frame);

  window.addEventListener('pointerdown', begin, { passive: true });
  window.addEventListener('keydown', begin);

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      setupCanvas();
      buildStars();
    }, 150);
  });

  // 防止移动端双击缩放
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
